[package]
name = "claude-guide"
version = "0.1.0"
edition = "2021"
description = "A TUI for managing Claude Code configurations"
license = "MIT"
repository = "https://github.com/cheng-chun-yuan/claude-guide"
keywords = ["cli", "tui", "claude", "configuration"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
anyhow = "1"
thiserror = "1"
walkdir = "2"
gray_matter = "0.2"
clap = { version = "4", features = ["derive"] }
tui-textarea = "0.7"

[profile.release]
lto = true
strip = true
codegen-units = 1
