[package]
name = "claude-guide"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["Cheng-Chun Yuan <cheng.chun.yuan@example.com>"]
description = "A TUI and CLI for managing Claude Code configurations, skills, plugins, and marketplaces"
license = "MIT"
repository = "https://github.com/cheng-chun-yuan/claude-guide"
homepage = "https://github.com/cheng-chun-yuan/claude-guide"
documentation = "https://github.com/cheng-chun-yuan/claude-guide#readme"
readme = "README.md"
keywords = ["cli", "tui", "claude", "ai", "configuration", "skills"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".sisyphus/", "*.bak"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
console = "0.15"
crossterm = "0.28"
dirs = "5"
gray_matter = "0.2"
indicatif = "0.17"
ratatui = "0.28"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
walkdir = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "claude-guide"
path = "src/main.rs"
